<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #374151; }
      .box { fill: #f9fafb; stroke: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .label { font: 600 15px Arial, sans-serif; fill: #111827; }
      .text { font: 14px Arial, sans-serif; fill: #1f2937; }
      .line { stroke: #111827; stroke-width: 2; fill: none; }
      .bus { stroke: #1d4ed8; stroke-width: 3; fill: none; }
      .gnd { stroke: #065f46; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <text x="40" y="48" class="title">Phase 4 Analog Drive Path Concept</text>
  <text x="40" y="78" class="subtitle">Selected hybrid switched-resistance architecture for KEY_ADC1 + KEY_ADC2</text>

  <rect class="box" x="40" y="130" width="280" height="180"/>
  <text class="label" x="60" y="160">Monitor Mainboard (CN1001)</text>
  <text class="text" x="60" y="195">Pin 1: GND</text>
  <text class="text" x="60" y="220">Pin 2: KEY_ADC2</text>
  <text class="text" x="60" y="245">Pin 3: KEY_ADC1</text>
  <text class="text" x="60" y="275">Original JOG remains connected</text>

  <rect class="box" x="400" y="120" width="360" height="240"/>
  <text class="label" x="420" y="155">Drive Board: KEY_ADC2 Multi-State Path</text>
  <text class="text" x="420" y="185">Analog switch U1 selects one resistor leg:</text>
  <text class="text" x="440" y="210">LEFT  -> R1 -> GND</text>
  <text class="text" x="440" y="232">RIGHT -> R2 -> GND</text>
  <text class="text" x="440" y="254">DOWN  -> R3 -> GND</text>
  <text class="text" x="440" y="276">UP    -> R4 -> GND</text>
  <text class="text" x="420" y="310">Default state: high-impedance (idle)</text>

  <rect class="box" x="400" y="400" width="360" height="180"/>
  <text class="label" x="420" y="435">Drive Board: KEY_ADC1 Center Path</text>
  <text class="text" x="420" y="465">Analog switch U2 gates center resistor R6</text>
  <text class="text" x="420" y="490">ON  -> KEY_ADC1 to GND through R6</text>
  <text class="text" x="420" y="515">OFF -> high-impedance (idle)</text>
  <text class="text" x="420" y="545">Fail-safe pulldowns force default-off</text>

  <rect class="box" x="860" y="220" width="300" height="260"/>
  <text class="label" x="880" y="255">Raspberry Pi / Controller Logic</text>
  <text class="text" x="880" y="285">- Select lines: ADC2_SEL0/1</text>
  <text class="text" x="880" y="310">- Enable: ADC2_EN</text>
  <text class="text" x="880" y="335">- Center enable: ADC1_CENTER_EN</text>
  <text class="text" x="880" y="370">Software rules:</text>
  <text class="text" x="900" y="395">1) break-before-make state changes</text>
  <text class="text" x="900" y="420">2) one active state at a time</text>
  <text class="text" x="900" y="445">3) release to Hi-Z on fault/exit</text>

  <path class="bus" d="M320 220 L400 220"/>
  <path class="bus" d="M320 250 L400 470"/>
  <path class="line" d="M760 260 L860 300"/>
  <path class="line" d="M760 480 L860 340"/>

  <path class="gnd" d="M520 320 L520 360"/>
  <path class="gnd" d="M520 360 L550 360"/>
  <path class="gnd" d="M535 370 L565 370"/>
  <path class="gnd" d="M548 380 L578 380"/>

  <path class="gnd" d="M520 560 L520 600"/>
  <path class="gnd" d="M520 600 L550 600"/>
  <path class="gnd" d="M535 610 L565 610"/>
  <path class="gnd" d="M548 620 L578 620"/>

  <text class="subtitle" x="40" y="715">Concept only; final electrical schematic and footprints are refined in integration phases.</text>
</svg>
