<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Custom KEY_ADC1 TX electrical connection</title>
  <desc id="desc">Raspberry Pi GPIO12 drives a 2N3904 through a 4.7 kiloohm base resistor. The transistor switches a 10 kiloohm resistor from KEY_ADC1 to ground. Separate native Center and observation branches share the bus.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .panel-title { fill: #0f172a; font: 700 22px system-ui, sans-serif; }
      .title { fill: #0f172a; font: 700 32px system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 16px system-ui, sans-serif; }
      .label { fill: #0f172a; font: 600 16px system-ui, sans-serif; }
      .small { fill: #475569; font: 14px system-ui, sans-serif; }
      .tiny { fill: #64748b; font: 12px system-ui, sans-serif; }
      .wire { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .bus { fill: none; stroke: #2563eb; stroke-width: 6; stroke-linecap: round; }
      .tx { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .native { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .sense { fill: none; stroke: #059669; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #334155; }
      .bus-node { fill: #2563eb; }
      .ground { fill: none; stroke: #334155; stroke-width: 3; }
      .pi-pin { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; }
      .tx-box { fill: #fff1f2; stroke: #fca5a5; stroke-width: 2; }
      .native-box { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 2; }
      .sense-box { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 2; }
      .note { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="920"/>
  <text class="title" x="54" y="52">Custom TX on KEY_ADC1</text>
  <text class="subtitle" x="54" y="80">Dedicated 10 kΩ low-side communication branch, with native Center and observation shown for context</text>

  <!-- column panels -->
  <rect class="panel" x="40" y="108" width="250" height="700" rx="16"/>
  <rect class="panel" x="315" y="108" width="790" height="700" rx="16"/>
  <rect class="panel" x="1130" y="108" width="230" height="700" rx="16"/>
  <text class="panel-title" x="64" y="145">Raspberry Pi 5</text>
  <text class="panel-title" x="340" y="145">Protoboard branches</text>
  <text class="panel-title" x="1154" y="145">J1 harness</text>

  <!-- Shared bus -->
  <path class="bus" d="M 1080 185 L 1080 708"/>
  <path class="bus" d="M 1080 300 L 1195 300"/>
  <circle class="bus-node" cx="1080" cy="300" r="7"/>
  <rect x="1195" y="255" width="125" height="90" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="1257" y="282" text-anchor="middle">J1 pin 3</text>
  <text class="label" x="1257" y="318" text-anchor="middle">KEY_ADC1</text>
  <text x="1098" y="205" fill="#2563eb" font-family="system-ui, sans-serif" font-size="15" font-weight="700">KEY_ADC1</text>
  <rect x="1195" y="405" width="125" height="78" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="label" x="1257" y="431" text-anchor="middle">J1 pin 2</text>
  <text class="label" x="1257" y="458" text-anchor="middle">KEY_ADC2</text>
  <text class="tiny" x="1257" y="502" text-anchor="middle">direction ladder</text>
  <rect x="1195" y="565" width="125" height="78" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text class="label" x="1257" y="591" text-anchor="middle">J1 pin 4</text>
  <text class="label" x="1257" y="618" text-anchor="middle">KEY_LED</text>
  <text class="tiny" x="1257" y="662" text-anchor="middle">custom RX</text>

  <!-- GPIO12 TX branch box -->
  <rect class="tx-box" x="334" y="165" width="742" height="205" rx="12"/>
  <text x="354" y="194" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="18" font-weight="700">CUSTOM TX — asserted resistance: 10 kΩ</text>
  <rect class="pi-pin" x="65" y="215" width="195" height="70" rx="10"/>
  <text class="label" x="162" y="242" text-anchor="middle">GPIO12 / pin 32</text>
  <text class="small" x="162" y="266" text-anchor="middle">custom KEY_ADC1 TX</text>
  <path class="tx" d="M 260 250 L 365 250"/>
  <!-- R26 -->
  <path class="tx" d="M 365 250 l 12 -13 l 18 26 l 18 -26 l 18 26 l 18 -26 l 18 26 l 12 -13 L 505 250"/>
  <text class="label" x="435" y="225" text-anchor="middle">R26 · 4.7 kΩ</text>
  <text class="tiny" x="435" y="286" text-anchor="middle">base-current limit</text>
  <circle cx="505" cy="250" r="6" fill="#dc2626"/>
  <!-- Q10 base and NPN -->
  <path class="tx" d="M 505 250 L 566 250"/>
  <path class="wire" d="M 566 211 L 566 289"/>
  <path class="wire" d="M 566 228 L 625 195 L 650 195"/>
  <path class="wire" d="M 566 272 L 625 305 L 650 305"/>
  <path class="wire" d="M 606 294 L 621 297 L 614 283"/>
  <text class="label" x="605" y="242">Q10</text>
  <text class="small" x="605" y="263">2N3904 NPN</text>
  <text class="tiny" x="572" y="218">C</text>
  <text class="tiny" x="572" y="296">E</text>
  <text class="tiny" x="550" y="244">B</text>
  <!-- R27 base pull-down -->
  <path class="wire" d="M 505 250 L 505 278"/>
  <path class="wire" d="M 505 278 l -13 10 l 26 14 l -26 14 l 26 14 l -13 10 L 505 350"/>
  <text class="small" x="455" y="319" text-anchor="end">R27</text>
  <text class="small" x="455" y="338" text-anchor="end">100 kΩ</text>
  <path class="ground" d="M 489 350 L 521 350 M 495 359 L 515 359 M 501 368 L 509 368"/>
  <!-- Q10 emitter ground -->
  <path class="wire" d="M 650 305 L 650 338"/>
  <path class="ground" d="M 634 338 L 666 338 M 640 347 L 660 347 M 646 356 L 654 356"/>
  <!-- R28 collector to bus -->
  <path class="tx" d="M 650 195 L 720 195"/>
  <path class="tx" d="M 720 195 l 12 -13 l 18 26 l 18 -26 l 18 26 l 18 -26 l 18 26 l 12 -13 L 860 195"/>
  <path class="tx" d="M 860 195 L 1080 195"/>
  <circle class="bus-node" cx="1080" cy="195" r="7"/>
  <text class="label" x="790" y="170" text-anchor="middle">R28 · 10 kΩ</text>
  <text class="tiny" x="922" y="218" text-anchor="middle">communication resistance</text>

  <!-- GPIO5 native center branch -->
  <rect class="native-box" x="334" y="392" width="742" height="180" rx="12"/>
  <text x="354" y="421" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="18" font-weight="700">NATIVE CENTER — asserted resistance: 22 Ω</text>
  <rect class="pi-pin" x="65" y="442" width="195" height="70" rx="10"/>
  <text class="label" x="162" y="469" text-anchor="middle">GPIO5 / pin 29</text>
  <text class="small" x="162" y="493" text-anchor="middle">CENTER</text>
  <path class="native" d="M 260 477 L 365 477"/>
  <!-- R5 -->
  <path class="native" d="M 365 477 l 12 -13 l 18 26 l 18 -26 l 18 26 l 18 -26 l 18 26 l 12 -13 L 505 477"/>
  <text class="label" x="435" y="452" text-anchor="middle">R5 · 4.7 kΩ</text>
  <circle cx="505" cy="477" r="6" fill="#7c3aed"/>
  <path class="native" d="M 505 477 L 566 477"/>
  <!-- Q3 -->
  <path class="wire" d="M 566 438 L 566 516"/>
  <path class="wire" d="M 566 455 L 625 422 L 650 422"/>
  <path class="wire" d="M 566 499 L 625 532 L 650 532"/>
  <path class="wire" d="M 606 521 L 621 524 L 614 510"/>
  <text class="label" x="605" y="469">Q3</text>
  <text class="small" x="605" y="490">2N3904 NPN</text>
  <!-- R15 base pull-down -->
  <path class="wire" d="M 505 477 L 505 499 l -13 9 l 26 12 l -26 12 l 26 12 l -13 9 L 505 554"/>
  <text class="small" x="455" y="524" text-anchor="end">R15</text>
  <text class="small" x="455" y="543" text-anchor="end">100 kΩ</text>
  <path class="ground" d="M 489 554 L 521 554 M 495 563 L 515 563 M 501 572 L 509 572"/>
  <path class="wire" d="M 650 532 L 650 548"/>
  <path class="ground" d="M 634 548 L 666 548 M 640 557 L 660 557 M 646 566 L 654 566"/>
  <!-- R10 -->
  <path class="native" d="M 650 422 L 720 422"/>
  <path class="native" d="M 720 422 l 12 -13 l 18 26 l 18 -26 l 18 26 l 18 -26 l 18 26 l 12 -13 L 860 422"/>
  <path class="native" d="M 860 422 L 1080 422"/>
  <circle class="bus-node" cx="1080" cy="422" r="7"/>
  <text class="label" x="790" y="397" text-anchor="middle">R10 · 22 Ω</text>

  <!-- Observation branch -->
  <rect class="sense-box" x="334" y="594" width="742" height="190" rx="12"/>
  <text x="354" y="623" fill="#047857" font-family="system-ui, sans-serif" font-size="18" font-weight="700">OBSERVATION — bus state to GPIO27</text>
  <path class="sense" d="M 1080 655 L 900 655"/>
  <circle class="bus-node" cx="1080" cy="655" r="7"/>
  <!-- R1 from bus -->
  <path class="sense" d="M 900 655 l -12 -13 l -18 26 l -18 -26 l -18 26 l -18 -26 l -18 26 l -12 -13 L 755 655"/>
  <text class="label" x="842" y="630" text-anchor="middle">R1 · 100 kΩ</text>
  <!-- Q1 -->
  <path class="sense" d="M 755 655 L 700 655"/>
  <path class="wire" d="M 700 616 L 700 694"/>
  <path class="wire" d="M 700 633 L 641 600 L 616 600"/>
  <path class="wire" d="M 700 677 L 641 710 L 616 710"/>
  <path class="wire" d="M 660 699 L 645 702 L 652 688"/>
  <text class="label" x="660" y="650" text-anchor="end">Q1</text>
  <text class="small" x="660" y="671" text-anchor="end">2N3904</text>
  <path class="wire" d="M 616 710 L 616 741"/>
  <path class="ground" d="M 600 741 L 632 741 M 606 750 L 626 750 M 612 759 L 620 759"/>
  <!-- Q1 collector/output -->
  <path class="sense" d="M 616 600 L 500 600 L 500 665 L 260 665"/>
  <circle cx="500" cy="600" r="6" fill="#059669"/>
  <rect class="pi-pin" x="65" y="630" width="195" height="70" rx="10"/>
  <text class="label" x="162" y="657" text-anchor="middle">GPIO27 / pin 13</text>
  <text class="small" x="162" y="681" text-anchor="middle">conditioned sense</text>
  <!-- R2 pullup, kept in the Pi panel to avoid crossing either drive branch -->
  <path class="wire" d="M 275 665 L 260 665"/>
  <path class="wire" d="M 275 665 L 275 644"/>
  <path class="wire" d="M 275 644 l -13 -10 l 26 -14 l -26 -14 l 26 -14 l -13 -10 L 275 568"/>
  <text class="small" x="247" y="617" text-anchor="end">R2</text>
  <text class="small" x="247" y="636" text-anchor="end">10 kΩ</text>
  <text class="label" x="275" y="552" text-anchor="middle">3.3 V</text>

  <!-- Note and state legend -->
  <rect class="note" x="40" y="830" width="1320" height="78" rx="12"/>
  <text x="64" y="857" fill="#92400e" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Required arbitration:</text>
  <text x="224" y="857" fill="#78350f" font-family="system-ui, sans-serif" font-size="16">never assert GPIO5 (Q3) and GPIO12 (Q10) at the same time.</text>
  <text x="64" y="874" fill="#78350f" font-family="system-ui, sans-serif" font-size="13">GPIO12 LOW → Q10 off → released / bit 0. GPIO12 HIGH → Q10 saturated → 10 kΩ to common GND / bit 1.</text>
  <text x="64" y="894" fill="#78350f" font-family="system-ui, sans-serif" font-size="13">R15 and R27 are fitted 100 kΩ base pull-downs from their respective base nodes to common GND.</text>
</svg>
