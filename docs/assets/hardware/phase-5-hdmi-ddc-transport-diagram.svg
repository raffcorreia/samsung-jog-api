  <title
     id="title">Phase 5 HDMI and DDC transport block diagram</title>
  <desc
     id="desc">Orthogonal diagram showing HDMI IN and HDMI OUT at the top, custom hardware in the middle, Raspberry Pi at the bottom, and explicit clean routes for pass-through, DDC, EDID, HPD, and source 5 volt detection.</desc>
