  <!-- Legend -->
  <g transform="translate(50 700)">
    <rect x="0" y="-16" width="28" height="28" class="power" stroke="#94a3b8"/>
    <text x="38" y="-2" class="legend-label">power rail</text>
    <rect x="170" y="-16" width="28" height="28" class="ground" stroke="#94a3b8"/>
