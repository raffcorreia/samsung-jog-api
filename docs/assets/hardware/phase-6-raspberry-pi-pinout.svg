      <text class="label" transform="rotate(-90)">GPIO5</text>
      <text class="sub" y="40" transform="rotate(-90)">CENTER drive</text>
    </g>
    <g transform="translate(1192 640)">
      <rect x="-35" y="-94" width="70" height="150" class="drive"/>
      <text class="label" transform="rotate(-90)">GPIO6</text>
      <text class="sub" y="40" transform="rotate(-90)">UP drive</text>
    </g>
    <g transform="translate(1266 640)">
      <rect x="-35" y="-94" width="70" height="150" class="drive"/>
      <text class="label" transform="rotate(-90)">GPIO13</text>
      <text class="sub" y="40" transform="rotate(-90)">DOWN drive</text>
    </g>
    <g transform="translate(1340 640)">
      <rect x="-35" y="-94" width="70" height="150" class="drive"/>
      <text class="label" transform="rotate(-90)">GPIO19</text>
      <text class="sub" y="40" transform="rotate(-90)">LEFT drive</text>
    </g>
    <g transform="translate(1414 640)">
      <rect x="-35" y="-94" width="70" height="150" class="drive"/>
      <text class="label" transform="rotate(-90)">GPIO26</text>
      <text class="sub" y="40" transform="rotate(-90)">RIGHT drive</text>
    </g>
    <g transform="translate(1488 640)">
      <rect x="-35" y="-94" width="70" height="150" class="ground"/>
      <text class="label" transform="rotate(-90)">GND</text>
      <text class="sub" y="40" transform="rotate(-90)">spare common</text>
    </g>
