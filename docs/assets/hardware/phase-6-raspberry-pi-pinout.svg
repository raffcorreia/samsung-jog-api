<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Phase 6 Raspberry Pi 40-pin GPIO wiring</title>
  <desc id="desc">Raspberry Pi 40-pin header diagram for the Phase 6 protoboard. Used pins are highlighted and labeled with their connection targets.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .rail { fill: #9f3d2d; }
      .pin { stroke: #1e293b; stroke-width: 2; }
      .pin-text { font: 24px sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .label { font: 22px sans-serif; font-weight: 700; fill: #111827; text-anchor: middle; }
      .sub { font: 15px sans-serif; fill: #475569; text-anchor: middle; }
      .small { font: 14px sans-serif; fill: #334155; }
      .title { font: 34px sans-serif; font-weight: 800; fill: #111827; }
      .note { font: 18px sans-serif; fill: #334155; }
      .power { fill: #fee2e2; }
      .ground { fill: #e5e7eb; }
      .i2c { fill: #dbeafe; }
      .observe { fill: #dcfce7; }
      .drive { fill: #fef3c7; }
      .reserved { fill: #ede9fe; }
      .unused { fill: #f1f5f9; }
      .legend-label { font: 17px sans-serif; fill: #111827; dominant-baseline: central; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="760"/>

  <text x="50" y="56" class="title">Phase 6 Raspberry Pi GPIO Wiring</text>
  <text x="50" y="88" class="note">Physical pin numbering. Odd pins are on the lower row; even pins are on the upper row. Use the Pi DISPLAY/USB side orientation to verify before wiring.</text>

  <!-- Header body -->
  <rect x="48" y="298" width="1504" height="188" rx="8" class="rail"/>
  <rect x="72" y="324" width="1456" height="136" rx="3" fill="#1f2937" opacity="0.18"/>

  <!-- Top labels: even physical pins -->
  <g id="top-labels">
    <g transform="translate(82 128)">
      <rect x="-35" y="-44" width="70" height="138" class="power"/>
      <text class="label" transform="rotate(-90)">5V</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(156 128)">
      <rect x="-35" y="-44" width="70" height="138" class="power"/>
      <text class="label" transform="rotate(-90)">5V</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(230 128)">
      <rect x="-35" y="-44" width="70" height="138" class="ground"/>
      <text class="label" transform="rotate(-90)">GND</text>
      <text class="sub" y="40" transform="rotate(-90)">common ground</text>
    </g>
    <g transform="translate(304 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO14</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(378 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO15</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(452 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO18</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(526 128)">
      <rect x="-35" y="-44" width="70" height="138" class="ground"/>
      <text class="label" transform="rotate(-90)">GND</text>
      <text class="sub" y="40" transform="rotate(-90)">spare common</text>
    </g>
    <g transform="translate(600 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO23</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(674 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO24</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(748 128)">
      <rect x="-35" y="-44" width="70" height="138" class="ground"/>
      <text class="label" transform="rotate(-90)">GND</text>
      <text class="sub" y="40" transform="rotate(-90)">spare common</text>
    </g>
    <g transform="translate(822 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO25</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(896 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO8</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(970 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO7</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(1044 128)">
      <rect x="-35" y="-44" width="70" height="138" class="reserved"/>
      <text class="label" transform="rotate(-90)">ID_SC</text>
      <text class="sub" y="40" transform="rotate(-90)">reserved</text>
    </g>
    <g transform="translate(1118 128)">
      <rect x="-35" y="-44" width="70" height="138" class="ground"/>
      <text class="label" transform="rotate(-90)">GND</text>
      <text class="sub" y="40" transform="rotate(-90)">spare common</text>
    </g>
    <g transform="translate(1192 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO12</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(1266 128)">
      <rect x="-35" y="-44" width="70" height="138" class="ground"/>
      <text class="label" transform="rotate(-90)">GND</text>
      <text class="sub" y="40" transform="rotate(-90)">spare common</text>
    </g>
    <g transform="translate(1340 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO16</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(1414 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO20</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(1488 128)">
      <rect x="-35" y="-44" width="70" height="138" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO21</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
  </g>

  <!-- Bottom labels: odd physical pins -->
  <g id="bottom-labels">
    <g transform="translate(82 640)">
      <rect x="-35" y="-94" width="70" height="150" class="power"/>
      <text class="label" transform="rotate(-90)">3.3V</text>
      <text class="sub" y="40" transform="rotate(-90)">logic / ADS rail</text>
    </g>
    <g transform="translate(156 640)">
      <rect x="-35" y="-94" width="70" height="150" class="i2c"/>
      <text class="label" transform="rotate(-90)">GPIO2</text>
      <text class="sub" y="40" transform="rotate(-90)">ADS SDA</text>
    </g>
    <g transform="translate(230 640)">
      <rect x="-35" y="-94" width="70" height="150" class="i2c"/>
      <text class="label" transform="rotate(-90)">GPIO3</text>
