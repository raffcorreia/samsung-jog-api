    <circle cx="1044" cy="354" r="30" class="pin reserved"/><text x="1044" y="354" class="pin-text">28</text>
    <circle cx="1118" cy="354" r="30" class="pin ground"/><text x="1118" y="354" class="pin-text">30</text>
    <circle cx="1192" cy="354" r="30" class="pin unused"/><text x="1192" y="354" class="pin-text">32</text>
