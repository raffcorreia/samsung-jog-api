  <!-- Pin holes -->
  <g id="pin-holes">
    <circle cx="82" cy="354" r="30" class="pin power"/><text x="82" y="354" class="pin-text">2</text>
    <circle cx="156" cy="354" r="30" class="pin power"/><text x="156" y="354" class="pin-text">4</text>
    <circle cx="230" cy="354" r="30" class="pin ground"/><text x="230" y="354" class="pin-text">6</text>
    <circle cx="304" cy="354" r="30" class="pin unused"/><text x="304" y="354" class="pin-text">8</text>
    <circle cx="378" cy="354" r="30" class="pin unused"/><text x="378" y="354" class="pin-text">10</text>
    <circle cx="452" cy="354" r="30" class="pin unused"/><text x="452" y="354" class="pin-text">12</text>
    <circle cx="526" cy="354" r="30" class="pin ground"/><text x="526" y="354" class="pin-text">14</text>
    <circle cx="600" cy="354" r="30" class="pin unused"/><text x="600" y="354" class="pin-text">16</text>
    <circle cx="674" cy="354" r="30" class="pin unused"/><text x="674" y="354" class="pin-text">18</text>
    <circle cx="748" cy="354" r="30" class="pin ground"/><text x="748" y="354" class="pin-text">20</text>
    <circle cx="822" cy="354" r="30" class="pin unused"/><text x="822" y="354" class="pin-text">22</text>
    <circle cx="896" cy="354" r="30" class="pin unused"/><text x="896" y="354" class="pin-text">24</text>
