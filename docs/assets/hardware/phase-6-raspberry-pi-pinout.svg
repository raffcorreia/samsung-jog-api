    <circle cx="1488" cy="354" r="30" class="pin unused"/><text x="1488" y="354" class="pin-text">40</text>

    <rect x="52" y="393" width="60" height="60" rx="3" class="pin power"/><text x="82" y="423" class="pin-text">1</text>
    <circle cx="156" cy="423" r="30" class="pin i2c"/><text x="156" y="423" class="pin-text">3</text>
    <circle cx="230" cy="423" r="30" class="pin i2c"/><text x="230" y="423" class="pin-text">5</text>
    <circle cx="304" cy="423" r="30" class="pin unused"/><text x="304" y="423" class="pin-text">7</text>
    <circle cx="378" cy="423" r="30" class="pin ground"/><text x="378" y="423" class="pin-text">9</text>
    <circle cx="452" cy="423" r="30" class="pin observe"/><text x="452" y="423" class="pin-text">11</text>
    <circle cx="526" cy="423" r="30" class="pin observe"/><text x="526" y="423" class="pin-text">13</text>
    <circle cx="600" cy="423" r="30" class="pin observe"/><text x="600" y="423" class="pin-text">15</text>
    <circle cx="674" cy="423" r="30" class="pin power"/><text x="674" y="423" class="pin-text">17</text>
    <circle cx="748" cy="423" r="30" class="pin unused"/><text x="748" y="423" class="pin-text">19</text>
    <circle cx="822" cy="423" r="30" class="pin unused"/><text x="822" y="423" class="pin-text">21</text>
    <circle cx="896" cy="423" r="30" class="pin unused"/><text x="896" y="423" class="pin-text">23</text>
    <circle cx="970" cy="423" r="30" class="pin ground"/><text x="970" y="423" class="pin-text">25</text>
    <circle cx="1044" cy="423" r="30" class="pin reserved"/><text x="1044" y="423" class="pin-text">27</text>
    <circle cx="1118" cy="423" r="30" class="pin drive"/><text x="1118" y="423" class="pin-text">29</text>
