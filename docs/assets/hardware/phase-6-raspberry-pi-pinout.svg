    </g>
    <g transform="translate(896 640)">
      <rect x="-35" y="-94" width="70" height="150" class="unused"/>
      <text class="label" transform="rotate(-90)">GPIO11</text>
      <text class="sub" y="40" transform="rotate(-90)">unused</text>
    </g>
    <g transform="translate(970 640)">
      <rect x="-35" y="-94" width="70" height="150" class="ground"/>
      <text class="label" transform="rotate(-90)">GND</text>
      <text class="sub" y="40" transform="rotate(-90)">spare common</text>
